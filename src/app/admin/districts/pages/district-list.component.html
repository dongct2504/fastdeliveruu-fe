<div class="container-fluid py-4">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="text-primary mb-0">Danh sách quận/huyện</h3>
        <div class="d-flex align-items-center">
            <!-- Search bar -->
            <div class="input-group me-3" style="width: 250px;">
                <input type="text" class="form-control" placeholder="Tìm kiếm..." [(ngModel)]="params.search"
                    (keyup.enter)="onSearch()" />
                <button class="btn btn-outline-secondary" type="button" (click)="onSearch()">
                    <i class="bi bi-search"></i>
                </button>
            </div>
            <!-- Add button -->
            <button class="btn btn-add-new" routerLink="/admin/districts/add">
                <i class="bi bi-plus-circle me-2"></i> Thêm quận/huyện
            </button>
        </div>
    </div>

    <!-- Table -->
    <div class="card shadow-sm border-0 rounded-3">
        <div class="card-body p-0">
            <table class="table table-hover table-borderless align-middle mb-0">
                <thead class="thead-light">
                    <tr>
                        <th>Tên quận/huyện</th>
                        <th>Ngày tạo</th>
                        <th>Ngày cập nhật</th>
                        <th class="text-end">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let district of districts">
                        <td>{{ district.name }}</td>
                        <td>{{ district.createdAt | date: 'dd/MM/yyyy HH:mm' }}</td>
                        <td>{{ district.updatedAt | date: 'dd/MM/yyyy HH:mm' }}</td>
                        <td class="text-end">
                            <button class="btn btn-sm btn-outline-primary me-2" (click)="editDistrict(district.id)">
                                <i class="bi bi-pencil"></i>
                            </button>
                            <button class="btn btn-sm btn-outline-danger" (click)="deleteDistrict(district.id)">
                                <i class="bi bi-trash"></i>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Footer -->
    <div class="mt-4">
        <app-paging-footer [itemsPerPage]="itemsPerPage" [totalRecords]="totalRecords"
            (pagedChanged)="onPageChanged($event)">
        </app-paging-footer>
    </div>
</div>
